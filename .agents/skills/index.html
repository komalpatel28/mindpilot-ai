<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindPilot AI - Interactive Study Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h2>🚀 MindPilot <span>AI</span></h2>
      </div>
      <button class="btn theme-btn" id="themeToggle" type="button">🌙 Dark Mode</button>
    </header>

    <main class="desk">
      <section class="panel">
        <h2>Paste Your Notes</h2>
        <textarea id="notesField" class="field" placeholder="Paste your study notes here..."></textarea>
        <button class="btn primary-btn" id="genBtn" type="button">⚡ Generate Quiz & Cards</button>
      </section>

      <section class="panel">
        <div class="mode-tabs">
          <button class="tab-btn active" id="tabQuiz" type="button">🎯 Quiz</button>
          <button class="tab-btn" id="tabCards" type="button">🎴 Flashcards</button>
        </div>

        <div id="quizContent">
          <div class="start-hero">
            <h3>Ready to Learn?</h3>
            <button class="btn primary-btn" id="startBtn" type="button">Start Quiz</button>
          </div>
        </div>

        <div id="flashcardContent" style="display: none;">
          <div class="flashcard" id="flashcard">
            <div class="card-front">
              <p id="cardQuestion">Click Generate to start flashcards.</p>
            </div>
            <div class="card-back" style="display: none;">
              <p id="cardAnswer">Answer here.</p>
            </div>
          </div>
          <div class="card-nav">
            <button class="btn" id="prevCard" type="button">Prev</button>
            <span id="cardCounter">1 / 1</span>
            <button class="btn" id="nextCard" type="button">Next</button>
          </div>
        </div>

        <div id="analytics" style="display: none; text-align: center;">
          <h3>Quiz Finished!</h3>
          <p>Your Score: <span id="scorePct">0%</span></p>
          <button class="btn primary-btn" id="retryBtn" type="button">Retake Quiz</button>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
